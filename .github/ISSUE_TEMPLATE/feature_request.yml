name: Feature request
description: Suggest a capability or improvement for snn-interpreter
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe the goal you are trying to reach, not
        only the implementation you have in mind. Check the README's
        "Implications and boundaries" section first — some limits are
        deliberate.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that the project does not let you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        The capability you want. If it touches the interpreter spine, name the
        `TopologySpec` / NIR contract it would extend.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and other approaches you weighed.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Spike encoders / datasets
        - Interpreter spine / NIR
        - Targets & backends
        - Model hub
        - Event runtime & energy
        - Observability / tracking
        - Dashboard (React client)
        - Packaging / CI / docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: honesty
    attributes:
      label: Honesty rule
      description: |
        This project reports unsupported, unavailable, or estimated things
        explicitly with a named reason.
      options:
        - label: I understand the request must not fake an unavailable result.
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
