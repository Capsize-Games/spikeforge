name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU wheels keep CI light; mirrors the Dockerfile TORCH_INDEX_URL flow.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e ".[dev,nir]"

      - name: Lint (ruff)
        run: ruff check snn_interpreter server main.py main_encodings.py tests

      - name: Test (pytest)
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build
