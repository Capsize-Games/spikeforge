name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels keep CI light; mirrors the Dockerfile TORCH_INDEX_URL flow.
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    # Static checks are interpreter-version agnostic; run them once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the core dev extra
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/spikeforge[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        # All seven distributions ship `py.typed`, which was a promise to type
        # checkers that nothing verified. `mypy.ini` documents what this gate
        # does and does not yet cover, and is written to be tightened.
        run: |
          pip install mypy
          mypy spikeforge/ spikeforge_targets/ spikeforge_hub/ \
               spikeforge_io/ spikeforge_serve/ spikeforge_clients/ server/

  test:
    # The full suite across every supported interpreter (python_requires).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install core + targets + hub + server + io editable
        run: |
          pip install -e "./packages/spikeforge[dev,nir]" \
                      -e ./packages/spikeforge-targets \
                      -e ./packages/spikeforge-hub \
                      -e ./packages/spikeforge-serve \
                      -e ./packages/spikeforge-server \
                      -e ./packages/spikeforge-io

      - name: Test (pytest)
        run: pytest

  test-deploy:
    # The simulator-backed test-deploy matrix for the linear `fc_legacy`
    # topology: exactly one cell per registered target, one JSON parity report,
    # exit 0 when the matrix is `ok`. No vendor SDK is installed, so every
    # SDK-backed cell must report `available: false` with a named reason — that
    # is honest reporting, not a build failure. The job asserts the command
    # exits 0 *and* that the JSON carries one cell per registered target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install core + targets editable
        run: |
          pip install -e "./packages/spikeforge[dev,nir]" \
                      -e ./packages/spikeforge-targets

      - name: Run the test-deploy matrix and assert one cell per target
        run: |
          python -m spikeforge.cli.verify test-deploy \
            --topology fc_legacy > "${RUNNER_TEMP}/test-deploy.json"
          python - <<'PY'
          import json
          import os

          from spikeforge_targets import registry

          with open(
              os.path.join(os.environ["RUNNER_TEMP"], "test-deploy.json"),
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)
          assert payload["ok"] is True, payload
          targets = [cell["target"] for cell in payload["cells"]]
          assert targets == registry.target_names(), (
              targets,
              registry.target_names(),
          )
          unavailable = [
              cell["target"] for cell in payload["cells"]
              if not cell["available"]
          ]
          print(f"test-deploy OK: {len(targets)} cells {targets}")
          print(f"unavailable (honest, not a failure): {unavailable}")
          PY

  hub:
    # The `hub` core extra is gone: the hub now ships as the `spikeforge-hub`
    # distribution (`spikeforge_hub` import root) and this job proves it installs from
    # source and its offline catalog/CLI work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install core + targets + hub + server editable
        run: |
          pip install -e "./packages/spikeforge[dev,nir]" \
                      -e ./packages/spikeforge-targets \
                      -e ./packages/spikeforge-hub \
                      -e ./packages/spikeforge-serve \
                      -e ./packages/spikeforge-server

      - name: Exercise the spikeforge-hub distribution
        run: |
          python -c "import spikeforge_hub, spikeforge_hub.cli; print('spikeforge_hub OK')"
          python -m spikeforge_hub.cli list > /dev/null
          pytest tests/test_hub_catalog.py tests/test_hub_cache.py \
                 tests/test_hub_verify.py tests/test_hub_inspect.py \
                 tests/test_cli_hub.py

  extras:
    # Prove every advertised extra still installs and does not rot.
    # `web` is gone: the server stack is now the server distribution's base
    # dependencies. `norse`/`lava` now live on `spikeforge-targets`; `norse` is
    # install-only here (the suite asserts the SDK-gated backends are
    # *absent*), and `docs` builds the site. `hub` is gone too: it is the
    # `spikeforge-hub` distribution, exercised by the `hub` job above.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["events", "onnx", "norse", "tracking", "docs"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install the ${{ matrix.extra }} extra (+ targets, hub, server)
        run: |
          # Every local distribution spikeforge-server depends on has to be
          # installed here too. A missing one does not fail loudly: pip
          # resolves that pin from PyPI instead, so the job silently tests a
          # mix of this checkout and the last published wheel -- and hard-fails
          # the moment the pin names a version PyPI does not have.
          # tests/test_packaging_profiles.py enforces the closure.
          if [ "${{ matrix.extra }}" = "norse" ]; then
            pip install \
              -e "./packages/spikeforge[dev,nir]" \
              -e "./packages/spikeforge-targets[norse]" \
              -e ./packages/spikeforge-hub \
              -e ./packages/spikeforge-serve \
              -e ./packages/spikeforge-server
          else
            pip install \
              -e "./packages/spikeforge[dev,nir,${{ matrix.extra }}]" \
              -e ./packages/spikeforge-targets \
              -e ./packages/spikeforge-hub \
              -e ./packages/spikeforge-serve \
              -e ./packages/spikeforge-server
          fi

      - name: Exercise the ${{ matrix.extra }} extra
        run: |
          if [ "${{ matrix.extra }}" = "norse" ]; then
            python -c "import norse; print('norse', norse.__version__)"
          elif [ "${{ matrix.extra }}" = "docs" ]; then
            python -m mkdocs --version
            bash scripts/build_docs.sh --check
          else
            pytest
          fi

  blocked-deps:
    # The honest-degradation gate: install the optional extras AND the server,
    # then make the whole forbidden set (SDKs plus fastapi/pydantic/uvicorn)
    # unimportable with a checked-in import blocker.
    #
    # Reconciliation: `server/` itself imports fastapi/pydantic, so the tests
    # that exercise the server must be deselected here — this job proves the
    # *core* degrades without the server stack, not that the server runs while
    # its own base deps are blocked. The 18 server-dependent test files are
    # enumerated with `--ignore` below; everything else runs under the blocker.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts/blocked_deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url ${{ env.TORCH_INDEX_URL }}

      - name: Install core + targets + hub + server editable with the extras
        run: |
          pip install \
            -e "./packages/spikeforge[dev,nir,events,onnx,tracking,tracking-wandb]" \
            -e ./packages/spikeforge-targets \
            -e ./packages/spikeforge-hub \
            -e ./packages/spikeforge-serve \
            -e ./packages/spikeforge-server

      - name: Test with the optional extras and the server stack blocked
        run: |
          pytest \
            --ignore=tests/test_client_animation_payload.py \
            --ignore=tests/test_client_cli.py \
            --ignore=tests/test_client_python.py \
            --ignore=tests/test_client_serve_contract.py \
            --ignore=tests/test_dashboard_auth.py \
            --ignore=tests/test_dashboard_bundle.py \
            --ignore=tests/test_dashboard_concurrency.py \
            --ignore=tests/test_dashboard_ws_auth.py \
            --ignore=tests/test_event_engine.py \
            --ignore=tests/test_event_server.py \
            --ignore=tests/test_event_training.py \
            --ignore=tests/test_geometry.py \
            --ignore=tests/test_pipeline_graph.py \
            --ignore=tests/test_pipeline_runner.py \
            --ignore=tests/test_pipeline_store.py \
            --ignore=tests/test_protocol_negotiation.py \
            --ignore=tests/test_protocol_schema_parity.py \
            --ignore=tests/test_server_backend_actions.py \
            --ignore=tests/test_server_bundle_route.py \
            --ignore=tests/test_server_energy_action.py \
            --ignore=tests/test_server_hub_actions.py \
            --ignore=tests/test_server_introspection_actions.py \
            --ignore=tests/test_server_mode_actions.py \
            --ignore=tests/test_server_model_actions.py \
            --ignore=tests/test_server_nir_actions.py \
            --ignore=tests/test_server_pipeline_actions.py \
            --ignore=tests/test_server_target_actions.py \
            --ignore=tests/test_serve_app.py \
            --ignore=tests/test_serve_metrics.py \
            --ignore=tests/test_serve_modules.py \
            --ignore=tests/test_serving_encode_contract.py \
            --ignore=tests/test_train_config_stage_overrides.py \
            --ignore=tests/test_train_config_topology.py \
            --ignore=tests/test_training_precision.py \
            --ignore=tests/test_training_topology_scaleup.py \
            --ignore=tests/test_uc1_serving_parity.py

  docs:
    # A broken documentation link must fail the pull request, not just a local
    # `build_docs.sh --check`. This gate covers the MkDocs tree in `docs/`;
    # the `published-surfaces` job below covers what readers actually land on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/spikeforge[docs]"

      - name: Check documentation links
        run: bash scripts/build_docs.sh --check

  published-surfaces:
    # The two pages a stranger actually lands on -- the PyPI project page and
    # docs.spikeforge.net -- are generated from files in this repository, and
    # neither was covered by any gate: the `docs` job validates the MkDocs
    # tree, which is published nowhere, and nothing at all looked at the
    # packaged README. Both surfaces are rendered here the way their host
    # renders them, so a dead link fails the pull request instead of shipping.
    #
    # Deliberately torch-free: readme_renderer plus the stdlib is the whole
    # dependency set, so this stays one of the fastest jobs in the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the renderer PyPI itself uses
        run: |
          python -m pip install --upgrade pip
          pip install "readme_renderer[md]"

      - name: The packaged README must render cleanly on PyPI
        run: python scripts/check_readme_links.py

      - name: The published documentation site must have no dead links
        run: python scripts/check_wiki_links.py

  client:
    # `client/` is a read-only mirror for one release; the full build now lives
    # in capsize-games/spikeforge-dashboard (its own CI runs `npm run build`). Core keeps
    # only the protocol-codegen guard so a schema change without regenerated
    # types is still caught here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Regenerate the protocol types
        working-directory: client
        run: npm run gen:protocol

      - name: The generated protocol types must be current
        run: git diff --exit-code -- client/src/protocol/generated.ts

      - name: Landing-page i18n (no build step, stdlib node only)
        run: node landing/i18n_test.js

  core-boundary:
    # The static half of the core boundary: no module-level import of a
    # forbidden root, and no function-local import outside the lazy shims.
    # Pure stdlib, so no dependencies are installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static core-boundary scan
        run: python scripts/check_core_boundary.py

  headless:
    # The artifact half of the core boundary: a core wheel built with NO extras
    # must install, import, and pull in none of the thirteen forbidden
    # distributions, and must not contain `server/`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the core wheel with no extras
        run: |
          python -m pip install --upgrade pip build
          python -m build ./packages/spikeforge

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/headless
          /tmp/headless/bin/python -m pip install --upgrade pip
          /tmp/headless/bin/pip install torch torchvision \
            --index-url ${{ env.TORCH_INDEX_URL }}
          /tmp/headless/bin/pip install \
            ./packages/spikeforge/dist/spikeforge-*.whl

      - name: Smoke-test every console script against the minimal install
        run: |
          PATH="/tmp/headless/bin:${PATH}" \
            /tmp/headless/bin/python scripts/check_console_scripts.py

      - name: Assert the headless wheel boundary
        run: |
          /tmp/headless/bin/python - <<'PY'
          import importlib.util as util
          import pathlib
          import zipfile

          forbidden = (
              "fastapi", "pydantic", "uvicorn", "huggingface_hub",
              "nir", "nirtorch", "onnx", "onnxruntime",
              "norse", "lava", "tonic", "tensorboard", "wandb",
          )
          for module in forbidden:
              assert util.find_spec(module) is None, (
                  f"core install leaked forbidden dep: {module}"
              )
          import spikeforge
          print("headless import OK:", spikeforge.__file__)

          wheel = next(
              pathlib.Path("packages/spikeforge/dist").glob("*.whl")
          )
          with zipfile.ZipFile(wheel) as archive:
              leaked = [
                  name for name in archive.namelist()
                  if name.split("/", 1)[0]
                  in ("server", "spikeforge_targets", "spikeforge_hub")
              ]
          assert not leaked, f"core wheel contains satellite roots: {leaked}"
          print("wheel is satellite-free:", wheel.name)
          PY

  packaging-guards:
    # The three lightweight topology guards: disjoint import roots (PEP 420),
    # console-script ownership, and satellite pins == compatibility.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distribution wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build ./packages/spikeforge
          python -m build ./packages/spikeforge-server
          python -m build ./packages/spikeforge-serve
          python -m build ./packages/spikeforge-clients
          python -m build ./packages/spikeforge-targets
          python -m build ./packages/spikeforge-hub
          python -m build ./packages/spikeforge-io

      - name: Run the packaging guards
        run: |
          python scripts/check_packaging_guards.py \
            --core-wheel packages/spikeforge/dist/spikeforge-*.whl \
            --server-wheel packages/spikeforge-server/dist/spikeforge_server-*.whl \
            --serve-wheel packages/spikeforge-serve/dist/spikeforge_serve-*.whl \
            --clients-wheel packages/spikeforge-clients/dist/spikeforge_clients-*.whl \
            --targets-wheel packages/spikeforge-targets/dist/spikeforge_targets-*.whl \
            --hub-wheel packages/spikeforge-hub/dist/spikeforge_hub-*.whl \
            --io-wheel packages/spikeforge-io/dist/spikeforge_io-*.whl
