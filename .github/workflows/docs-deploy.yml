name: Deploy landing page

# Publishes the static landing page to spikeforge.net. Long-form
# documentation is synchronized separately to the project GitHub Wiki.

on:
  push:
    branches: [main, arch-0001/phase-1]
    paths:
      - ".maintenance-mode"
      - "landing/**"
      - "spikeforge_hub/models.json"
      - "scripts/build_hub_page.py"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: "Persist the deployed Spikeforge Pages maintenance state"
        required: true
        type: choice
        options:
          - "on"
          - "off"

permissions:
  contents: read

# Only one Pages deployment at a time; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  persist-maintenance-mode:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Save requested maintenance mode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAINTENANCE_MODE: ${{ inputs.maintenance_mode }}
        run: gh variable set SPIKEFORGE_MAINTENANCE_MODE --repo "$GH_REPO" --body "$MAINTENANCE_MODE"

  build:
    needs: persist-maintenance-mode
    if: ${{ always() && (needs.persist-maintenance-mode.result == 'success' || needs.persist-maintenance-mode.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assemble the Pages root
        run: |
          mkdir -p build/pages
          cp landing/index.html build/pages/index.html
          cp landing/i18n.js build/pages/i18n.js
          cp landing/locales.js build/pages/locales.js
          cp landing/cta-locales.js build/pages/cta-locales.js
          cp landing/robots.txt build/pages/robots.txt
          cp landing/sitemap.xml build/pages/sitemap.xml
          cp -r landing/assets build/pages/assets
          cp landing/CNAME build/pages/CNAME
          cp -r landing/privacy build/pages/privacy

      - name: Render the model-hub catalog page (stdlib-only, no core install)
        run: |
          python scripts/build_hub_page.py --out build/pages/hub/index.html

      - name: Apply maintenance page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mode="$(gh variable get SPIKEFORGE_MAINTENANCE_MODE --repo "$GH_REPO" 2>/dev/null || true)"
          if [ -z "$mode" ]; then
            if [ -f .maintenance-mode ]; then mode=on; else mode=off; fi
          fi
          if [ "$mode" = "on" ]; then
            find build/pages -type f -name '*.html' \
              -exec cp landing/maintenance.html {} \;
          elif [ "$mode" != "off" ]; then
            echo "Unknown maintenance mode: $mode" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
