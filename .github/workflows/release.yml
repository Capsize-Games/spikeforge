name: Release

# Tags are the only release trigger. The tag scheme is
# `<distribution>-v<version>` (for example `spikeforge-v0.3.0` or
# `spikeforge-server-v0.1.0`); the prefix selects `packages/<distribution>`.
on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read

jobs:
  parse:
    # Split from `release` so the tag can be parsed *before* a PyPI
    # environment is selected -- a job's `environment:` is resolved at
    # job start and cannot see another step's outputs in the same job,
    # only a prior job's via `needs.*.outputs`.
    name: Parse ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      distribution: ${{ steps.parse.outputs.distribution }}
      version: ${{ steps.parse.outputs.version }}
      package_dir: ${{ steps.parse.outputs.package_dir }}
    steps:
      - name: Parse the release tag
        id: parse
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-v*) ;;
            *) echo "tag '$tag' is not <distribution>-v<version>"; exit 1 ;;
          esac
          distribution="${tag%-v*}"
          version="${tag##*-v}"
          package_dir="packages/${distribution}"
          echo "distribution=${distribution}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package_dir=${package_dir}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${distribution} ${version} from ${package_dir}"

  release:
    name: Publish ${{ github.ref_name }}
    needs: parse
    runs-on: ubuntu-latest
    # Named after the distribution (e.g. "spikeforge-hub") so it matches
    # that PyPI project's trusted-publisher "Environment name" -- required
    # because every distribution shares this same repo + workflow file,
    # and PyPI's pending-publisher registration must be unique per project
    # on (repo, workflow, environment).
    environment: ${{ needs.parse.outputs.distribution }}
    # `id-token: write` mints the short-lived OIDC token the publish action
    # exchanges for an upload credential; no long-lived API token is stored.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Confirm the distribution exists
        env:
          PACKAGE_DIR: ${{ needs.parse.outputs.package_dir }}
        run: |
          set -euo pipefail
          if [ ! -f "${PACKAGE_DIR}/pyproject.toml" ]; then
            echo "no distribution at ${PACKAGE_DIR}"; exit 1
          fi

      - name: Verify the tag against pyproject and compatibility.json
        env:
          DISTRIBUTION: ${{ needs.parse.outputs.distribution }}
          VERSION: ${{ needs.parse.outputs.version }}
          PACKAGE_DIR: ${{ needs.parse.outputs.package_dir }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import tomllib
          from pathlib import Path

          distribution = os.environ["DISTRIBUTION"]
          version = os.environ["VERSION"]
          package_dir = Path(os.environ["PACKAGE_DIR"])

          text = (package_dir / "pyproject.toml").read_text(encoding="utf-8")
          project = tomllib.loads(text)["project"]
          if project["version"] != version:
              sys.exit(
                  f"tag {distribution}-v{version} != pyproject "
                  f"{project['version']}"
              )

          matrix = json.loads(
              Path("compatibility.json").read_text(encoding="utf-8")
          )
          release = matrix["releases"][-1]
          if release.get(distribution) != version:
              sys.exit(
                  f"compatibility.json has no {distribution} {version}"
              )

          core = "spikeforge"

          # Core-free distributions deliberately ship no ``spikeforge`` core
          # dependency (a client install must never pull torch), so they are
          # exempt from the core-pin rule -- but they must declare NO core
          # dependency at all. Every other non-core distribution must pin core
          # exactly ``spikeforge~=<matrix core version>``.
          core_free_distributions = {"spikeforge-clients"}

          def _requirement_name(requirement):
              """Return the bare distribution name of a requirement."""
              for index, char in enumerate(requirement):
                  if char in "<>=!~;[":
                      return requirement[:index].strip()
              return requirement.strip()

          if distribution != core:
              expected = f"{core}~={release.get(core)}"
              pins = [
                  dep
                  for dep in project.get("dependencies", [])
                  if _requirement_name(dep) == core
              ]
              if distribution in core_free_distributions:
                  if pins:
                      sys.exit(
                          f"refusing to publish {distribution}: it is declared "
                          f"core-free but declares core dependencies {pins}"
                      )
              elif pins != [expected]:
                  sys.exit(
                      f"refusing to publish {distribution}: core pin "
                      f"{pins} is not the matrix pin {expected!r}"
                  )
          print(f"{distribution} {version}: tag, pyproject, matrix agree")
          PY

      - name: Run the packaging guards
        run: python scripts/check_packaging_guards.py

      - name: Resolve the matrix row from local builds
        run: |
          set -euo pipefail
          # The 0.6.0 release shipped a compatibility.json row pip could
          # not install (core 0.6.0 with satellites pinning ~=0.5.x), and
          # agreement checks cannot see that: only a real resolution can.
          # The row's newest versions are not on PyPI yet at gate time, so
          # resolve against wheels built from this checkout (which the
          # guards above prove match the matrix) instead of PyPI alone.
          python -m pip install --upgrade pip build
          rm -rf dist-all
          for dist in spikeforge spikeforge-server spikeforge-serve \
              spikeforge-clients spikeforge-targets spikeforge-hub \
              spikeforge-io; do
            python -m build "packages/${dist}" --outdir dist-all
          done
          mapfile -t pins < <(python - <<'PY'
          import json
          matrix = json.load(open("compatibility.json", encoding="utf-8"))
          for name, version in matrix["releases"][-1].items():
              if name != "dashboard":
                  print(f"{name}=={version}")
          PY
          )
          python -m pip install --dry-run --find-links dist-all "${pins[@]}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build "${{ needs.parse.outputs.package_dir }}"

      - name: Install the hub wheel into a clean venv
        # Issue #164: the hub wheel's runtime data (models.json plus the
        # reference weights) is invisible to every static guard, so a hub
        # release proves the exact published artifact loads its catalog
        # and verifies its weights before it reaches PyPI. No other
        # distribution ships runtime data, so only hub releases pay for
        # this venv.
        if: needs.parse.outputs.distribution == 'spikeforge-hub'
        env:
          PACKAGE_DIR: ${{ needs.parse.outputs.package_dir }}
        run: |
          set -euo pipefail
          python -m venv /tmp/hub-smoke
          /tmp/hub-smoke/bin/python -m pip install --upgrade pip
          # CPU wheels keep this light; mirrors ci.yml's TORCH_INDEX_URL.
          /tmp/hub-smoke/bin/pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          # The wheel under test is the one the publish step uploads; the
          # row's other distributions resolve from the local builds above
          # when they are newer than PyPI.
          /tmp/hub-smoke/bin/pip install \
            "${PACKAGE_DIR}"/dist/spikeforge_hub-*.whl \
            --find-links dist-all

      - name: Smoke-test the hub wheel's catalog and weights
        if: needs.parse.outputs.distribution == 'spikeforge-hub'
        run: |
          # From /tmp so the checkout never shadows the installed wheel
          # on sys.path (``python -`` puts the cwd first).
          cd /tmp
          /tmp/hub-smoke/bin/python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          import spikeforge_hub

          wheel_home = Path(spikeforge_hub.__file__).resolve().parent
          assert "/tmp/hub-smoke/" in str(wheel_home), (
              f"smoke test imported {wheel_home}, not the wheel"
          )
          completed = subprocess.run(
              ["/tmp/hub-smoke/bin/spikeforge-hub", "list"],
              capture_output=True,
              text=True,
              check=False,
          )
          assert completed.returncode == 0, completed.stderr
          payload = json.loads(completed.stdout)
          assert payload["entries"], "the wheel's catalog lists no rows"
          assert payload["issues"] == [], payload["issues"]

          from spikeforge_hub.catalog import entries
          from spikeforge_hub.inspect import reference_path
          from spikeforge_hub.verify import verify_file

          references = [
              entry for entry in entries() if entry.source == "reference"
          ]
          assert references, "the wheel carries no reference rows"
          for entry in references:
              path = reference_path(entry)
              result = verify_file(path, entry.sha256, entry.size_bytes)
              assert result.verified, f"{entry.id}: {result.reason}"
              print(f"{entry.id}: verified {path}")
          print(
              f"hub smoke OK: {len(payload['entries'])} rows, "
              f"{len(references)} reference weights verified"
          )
          PY

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.parse.outputs.package_dir }}/dist
