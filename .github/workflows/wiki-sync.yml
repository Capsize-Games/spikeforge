name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - "plans/**"
      - "examples/README.md"
      - "protocol/README.md"
      - "COOKBOOK.md"
      - "scripts/build_wiki.py"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone the project wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            build/wiki

      - name: Build wiki pages
        run: python3 scripts/build_wiki.py build/wiki

      - name: Publish changed pages
        working-directory: build/wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: sync project documentation"
          git push origin master
