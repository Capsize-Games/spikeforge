services:
  snn-interpreter:
    build: .
    container_name: snn-interpreter
    ports:
      # Host 8877 -> container 8877 (single port for web + ws + api).
      - "8877:8877"
    volumes:
      # Persist downloaded datasets + generated outputs across restarts.
      - snn-data:/data
    environment:
      - SNN_DATA_DIR=/data
    restart: unless-stopped

volumes:
  snn-data:
