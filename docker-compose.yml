services:
  # Default service: `docker compose up --build` still builds the CUDA-capable
  # image and serves the dashboard on port 8877. The image (see Dockerfile)
  # installs the full server-chain set -- core, targets, hub, and the
  # `packages/spikeforge-server` distribution -- so the removed core `web`
  # extra is no longer involved. Services below are opt-in alternatives
  # selected with `--profile cpu` / `--profile gpu`.
  spikeforge:
    build: .
    container_name: spikeforge
    ports:
      # Host 8877 -> container 8877 (single port for web + ws + api).
      # Override the host port with SPIKEFORGE_HOST_PORT (scripts/docker_server.sh
      # --port N sets this for you).
      - "${SPIKEFORGE_HOST_PORT:-8877}:8877"
    volumes:
      # Persist downloaded datasets + generated outputs across restarts.
      - spikeforge-data:/data
    environment:
      - SPIKEFORGE_DATA_DIR=/data
    # Request the host GPU so the container can train on CUDA. Needs the
    # NVIDIA Container Toolkit; ignored when no GPU is present.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # CPU-only image: `docker compose --profile cpu up --build`.
  # Smaller and portable; no GPU reserved.
  spikeforge-cpu:
    profiles: ["cpu"]
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    container_name: spikeforge-cpu
    ports:
      - "${SPIKEFORGE_HOST_PORT:-8877}:8877"
    volumes:
      - spikeforge-data:/data
    environment:
      - SPIKEFORGE_DATA_DIR=/data
    restart: unless-stopped

  # Explicit CUDA image: `docker compose --profile gpu up --build`.
  # Same build as the default service, kept explicit for parity with `cpu`.
  spikeforge-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu132
    container_name: spikeforge-gpu
    ports:
      - "${SPIKEFORGE_HOST_PORT:-8877}:8877"
    volumes:
      - spikeforge-data:/data
    environment:
      - SPIKEFORGE_DATA_DIR=/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  spikeforge-data:
