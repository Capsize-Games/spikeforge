# MkDocs Material site generated from plans/ and README.md.
#
# docs/ is regenerated by scripts/build_docs.sh; never edit it by hand. The
# markdown in plans/ stays authoritative, and `build_docs.sh --check` runs
# `mkdocs build --strict` so a broken documentation link fails the build.
site_name: spikeforge
site_description: >-
  Design documents for the spikeforge spiking neural network playground
  and its professionalization program.
docs_dir: docs
site_dir: build/docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The plan documents intentionally reference repository source files (e.g.
# ``spikeforge/...py:14``); MkDocs cannot tell those apart from a broken
# documentation link, so its own link check is relaxed here. Integrity of
# links *between documentation pages* is instead enforced by
# ``scripts/check_docs_links.py``, which ``build_docs.sh --check`` runs.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Guides:
      - Cookbook: COOKBOOK.md
      - Examples: examples.md
      - Open-source checklist: OPEN_SOURCE_CHECKLIST.md
  - Long-form reference:
      - Overview: documentation.md
      - Quickstart: quickstart.md
      - Requirements: requirements.md
      - Usage: usage.md
      - Development: development.md
      - Architecture: architecture.md
      - Project layout: project-layout.md
      - Features: features.md
      - Interpreter spine: interpreter-spine.md
      - Introspection: introspection.md
      - Dashboard: dashboard.md
      - Event datasets: event-datasets.md
      - Targets and interoperability: targets-and-interop.md
      - Production workflows: production-workflows.md
      - Model hub: model-hub.md
      - Backend execution: backend-execution.md
      - Sequence primitives: sequence-primitives.md
      - Streaming time series: streaming-timeseries.md
      - Event runtime and energy: event-runtime-and-energy.md
      - Operational maturity: operational-maturity.md
      - Interop fold-ins: interop-foldins.md
      - Model deployment: model-deployment.md
      - Implications and boundaries: implications-and-boundaries.md
      - Notes: notes.md
  - Roadmap:
      - Professionalization roadmap: professional_roadmap.md
      - Ecosystem roadmap: ecosystem_roadmap.md
  - Architecture:
      - Repo topology and split: repo_topology_plan.md
      - ARCH-0001 phased repo split:
          - "ADR repository topology": arch-0001-adr-repo-topology.md
          - Target topology: arch-0001-target-topology.md
          - Core boundary: arch-0001-core-boundary.md
          - Protocol contract: arch-0001-protocol-contract.md
          - Packaging and versioning: arch-0001-packaging-versioning.md
          - Migration plan: arch-0001-migration-plan.md
