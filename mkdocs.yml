# MkDocs Material site generated from plans/ and README.md.
#
# docs/ is regenerated by scripts/build_docs.sh; never edit it by hand. The
# markdown in plans/ stays authoritative, and `build_docs.sh --check` runs
# `mkdocs build --strict` so a broken documentation link fails the build.
site_name: snn-interpreter
site_description: >-
  Design documents for the snn-interpreter spiking neural network playground
  and its professionalization program.
docs_dir: docs
site_dir: build/docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The plan documents intentionally reference repository source files (e.g.
# ``snn_interpreter/...py:14``); MkDocs cannot tell those apart from a broken
# documentation link, so its own link check is relaxed here. Integrity of
# links *between documentation pages* is instead enforced by
# ``scripts/check_docs_links.py``, which ``build_docs.sh --check`` runs.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Guides:
      - Cookbook: COOKBOOK.md
      - Examples: examples.md
      - Open-source checklist: OPEN_SOURCE_CHECKLIST.md
  - Roadmap:
      - Professionalization roadmap: professional_roadmap.md
      - Ecosystem roadmap: ecosystem_roadmap.md
  - Workstreams:
      - Interpreter spine: interpreter_spine_plan.md
      - Model hub: model_hub_plan.md
      - Backend execution: backend_execution_plan.md
      - Sequence primitives: sequence_primitives_plan.md
      - Event runtime: event_runtime_plan.md
      - Operations: operations_plan.md
      - Interop fold-ins: interop_foldins_plan.md
  - Reference:
      - Project rules: rules.md
      - Integration plan: INTEGRATION_PLAN.md
  - README: readme.md
