# Type-checking configuration for the seven distributions.
#
# All seven ship ``py.typed``, which is a promise to type checkers that
# nothing verified until this gate existed. The gate is deliberately a
# *ratchet*: it is green today and the exclusions below are a list to shrink,
# not a permanent carve-out.
#
# Two things are excluded, for different reasons:
#
# 1. ``attr-defined`` is disabled globally. The training engine and the
#    server sessions are composed from mixins (``EvalMixin``,
#    ``CheckpointMixin``, ``TopologyMixin``, ...) that legitimately reference
#    attributes the composed class owns. mypy cannot see through that
#    composition and reported 59 such errors, none of them a real defect.
#    Re-enabling it means making the mixins Protocol-typed, which is a
#    deliberate refactor rather than a typing fix.
#
# 2. The modules under ``[mypy-*]`` below carry the remaining 28 errors,
#    almost all "Optional not narrowed" against torch's partial stubs. Each is
#    a small, local fix. Delete a line here, fix what it reports, and the
#    ratchet has moved.
#
# See the current backlog with:
#
#     mypy --ignore-missing-imports spikeforge/ spikeforge_targets/ \
#          spikeforge_hub/ spikeforge_io/ spikeforge_serve/ \
#          spikeforge_clients/ server/

[mypy]
# Deliberately unpinned: pinning to the oldest supported interpreter makes
# mypy reject third-party stubs written with newer syntax (numpy's, today).
# CI runs this on 3.12, the same interpreter as the lint job.
# torch, snntorch, nir, tonic and the vendor SDKs ship partial or no stubs;
# a missing stub is not a defect in this codebase.
ignore_missing_imports = True
# See (1) above.
disable_error_code = attr-defined
# Generated and third-party trees are not ours to type.
exclude = (?x)(^build/|^docs/|^client/|^\.venv/)

[mypy-server.bundle_routes]
ignore_errors = True

