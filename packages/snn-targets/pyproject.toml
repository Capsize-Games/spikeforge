# PEP 621 packaging authority for the snn-targets distribution (ARCH-0001
# Phase 3).
#
# The distribution owns the ``snn_targets`` import root, which absorbs the
# former ``snn_interpreter.targets`` (plus ``.backends``), ``.energy`` and
# ``.event_runtime`` subpackages. It depends on core, but core never depends on
# it. The volatile backend SDKs (norse, lava) are optional extras here, which
# is why core no longer advertises them.
#
# ``snn_targets/`` stays at its repository-root path and is exposed to the
# build via the ``snn_targets`` symlink next to this file (the same pattern the
# core and server distributions use; see the ``packages.find`` table below).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snn-targets"
version = "0.1.0"
description = "Deployment targets, event-driven energy accounting, and backend execution for snn-interpreter."
# ``README.md`` and ``LICENSE`` are committed symlinks to the repository-root
# files, mirroring the core and server distributions' metadata approach.
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "w4ffl35", email = "contact@capsizegames.com" },
]
keywords = [
    "spiking neural networks",
    "deployment",
    "neuromorphic",
    "lava",
    "norse",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "snn-interpreter~=0.3.0",
    "numpy>=1.26",
    "torch>=2.5",
]

[project.optional-dependencies]
norse = [
    "norse",
]
lava = [
    "lava-nc",
]

[project.scripts]
snn-energy = "snn_targets.energy.cli:main"
snn-targets = "snn_targets.cli.target_cli:main"

[project.urls]
Homepage = "https://github.com/w4ffl35/snn_interpreter"
Repository = "https://github.com/w4ffl35/snn_interpreter"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
# Mirror the core/server distributions: the `snn_targets` import root is
# exposed next to this file as a symlink to `../../snn_targets` so the default
# via-sdist `python -m build` produces a complete wheel. Discovery depends only
# on this top-level package, never on core.
where = ["."]
include = ["snn_targets*"]
exclude = ["snn_interpreter*", "server*", "tests*"]
