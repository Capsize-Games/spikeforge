[pytest]
testpaths = tests
pythonpath = . scripts
# One --cov flag per import root (issue #115): the server, the five
# satellite distributions, and scripts are measured alongside the core
# package. The ratchet itself (--fail-under) lives in the CI `test` job,
# not here, so partial runs (blocked-deps, hub subsets) still report.
addopts = --cov=spikeforge --cov=server --cov=spikeforge_targets --cov=spikeforge_hub --cov=spikeforge_io --cov=spikeforge_serve --cov=spikeforge_clients --cov=scripts --cov-report=term-missing
markers =
    network: fetches a dataset, so it reaches the network on a cold
        SPIKEFORGE_DATA_DIR (~64 MB of MNIST). Deselect with
        -m "not network" to run the suite fully offline; CI runs them.
