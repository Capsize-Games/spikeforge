[pytest]
testpaths = tests
pythonpath = . scripts
addopts = --cov=spikeforge --cov-report=term-missing
markers =
    network: downloads a dataset on a cold SPIKEFORGE_DATA_DIR, so it
        reaches the network. Every downloading test carries this mark;
        deselect with -m "not network" to run the suite fully offline.
        CI runs the marked tests as well as the offline subset.
