[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=spikeforge --cov-report=term-missing
markers =
    network: fetches a dataset, so it reaches the network on a cold
        SPIKEFORGE_DATA_DIR (~64 MB of MNIST). Deselect with
        -m "not network" to run the suite fully offline; CI runs them.
